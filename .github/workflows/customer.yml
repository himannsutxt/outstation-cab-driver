name: Build customer APK
on:
  push:
    branches: [main]
    paths: ['customer/**', '.github/workflows/customer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.aravallicabs --project-name aravalli_cabs .
          rm -f test/widget_test.dart
          python3 ci/patch_android.py
      - name: Use the fixed signing key (so updates install over older versions)
        run: mkdir -p ~/.android && cp ../ci/debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - name: Name the APK
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "aravalli-cabs-v$V.apk"
          echo "V=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: aravalli-cabs-apk, path: customer/aravalli-cabs-v*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-v${{ env.V }}-${{ github.run_number }}
          name: Customer app v${{ env.V }} (build ${{ github.run_number }})
          files: customer/aravalli-cabs-v*.apk
